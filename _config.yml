# Google Analytics ID
# Please remove this if you don't use Google Analytics

# Local static layout and compressed shared stylesheet.
url: https://siyuanj.github.io
baseurl: ""
sass:
  style: compressed


collections:
  notes:
    output: true
    directory: _notes  # 指定文件夹名称
  blogs:
    output: true
    directory: _blogs
  
# The following files will be removed from the generated website.
exclude:
  - AGENTS.md
  - CLAUDE.md
  - docs/
  - scripts/
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - minimal-light.gemspec
  - html_source_file/

# Defaults Configuration
defaults:
  - scope:
      path: ""
      type: "blogs"  # 对应 _blogs 文件夹
    values:
      layout: "post" # 使用 _layouts/post.html
  - scope:
      path: ""
      type: "notes"  # 对应 _notes 文件夹
    values:
      layout: "post"
