---
layout: homepage
---
<article class="post-content">
  <header class="post-header">
    {% if page.collection == 'notes' %}<a class="post-back" href="{{ '/note/' | relative_url }}">← All notes</a>{% else %}<a class="post-back" href="{{ '/blog/' | relative_url }}">← All blog posts</a>{% endif %}
    {% unless content contains '<h1' %}{% if page.title %}<h2 class="post-title">{{ page.title | escape }}</h2>{% endif %}{% endunless %}
    {% if page.date %}<p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>{% endif %}
  </header>
  {{ content }}
</article>
