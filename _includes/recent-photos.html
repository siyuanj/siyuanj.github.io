{% if site.data.photos.size > 0 %}
<section class="recent-photos" aria-labelledby="recent-photos" aria-roledescription="carousel">
  <h2 id="recent-photos"><span>Recent Photos</span></h2>
  <div class="photo-carousel splide" id="photo-carousel" data-photo-carousel aria-labelledby="recent-photos">
  <div class="photo-gallery splide__track" id="photo-gallery" tabindex="0" aria-label="Photos: swipe horizontally or use the left and right arrow keys">
    <div class="photo-track splide__list">
    {% for photo in site.data.photos %}
    <figure class="recent-photo splide__slide" style="--photo-ratio: {{ photo.width | times: 1.0 | divided_by: photo.height }};" data-photo-index="{{ forloop.index0 }}" role="group" aria-roledescription="slide" aria-label="{{ forloop.index }} of {{ forloop.length }}: {% if photo.display_date %}{{ photo.display_date | escape }} · {% endif %}{{ photo.caption | replace: '[doge]', ' doge' | escape }}">
      <a class="recent-photo-link" href="{{ photo.image | relative_url }}" aria-label="View full-size photo: {% if photo.display_date %}{{ photo.display_date | escape }} · {% endif %}{{ photo.caption | replace: '[doge]', ' doge' | escape }}">
        <img src="{{ photo.preview | relative_url }}" srcset="{{ photo.preview | relative_url }} 640w, {{ photo.preview_large | relative_url }} 1280w" sizes="(max-width: 520px) 45vw, 270px" width="{{ photo.width }}" height="{{ photo.height }}" alt="{{ photo.alt | escape }}" loading="lazy" decoding="async">
      </a>
      <figcaption>{% if photo.date and photo.display_date %}<time datetime="{{ photo.date | escape }}">{{ photo.display_date | escape }}</time><span aria-hidden="true"> · </span>{% endif %}{% include photo-caption.html text=photo.caption %}</figcaption>
    </figure>
    {% endfor %}
    </div>
  </div>
  {% comment %}Static layer masks adapted from motion-primitives ProgressiveBlur; see vendor notice.{% endcomment %}
  <div class="photo-edge photo-edge-left" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="photo-edge photo-edge-right" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="photo-controls" hidden>
    <button class="photo-arrow photo-previous" type="button" aria-label="Previous photo" aria-controls="photo-gallery"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="photo-arrow photo-next" type="button" aria-label="Next photo" aria-controls="photo-gallery"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="photo-dots" aria-label="Choose a photo" hidden>
    {% for photo in site.data.photos %}<button class="photo-dot" type="button" data-photo-index="{{ forloop.index0 }}" aria-label="Show photo {{ forloop.index }} of {{ forloop.length }}: {{ photo.caption | replace: '[doge]', ' doge' | escape }}" aria-controls="photo-gallery"{% if forloop.first %} aria-current="true"{% endif %}></button>{% endfor %}
  </div>
  <p class="photo-status" role="status" aria-live="polite" aria-atomic="true"></p>
  </div>
</section>
{% endif %}
