<nav class="top-nav" aria-label="Main navigation">
  {% for item in site.data.navigation %}
  <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% elsif item.collection and page.collection == item.collection %} aria-current="page"{% endif %}>{{ item.title }}</a>
  {% endfor %}
</nav>
